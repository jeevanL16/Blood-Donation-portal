<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
</head>
<body id="fedbody">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand" href="/">BloodPortal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Feedback</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="fed mt-5" data-aos="fade-up">
  <h2 class="text-center text-danger mb-4">Your Feedback</h2>
  <form method="POST" action="/feedback">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      <label for="name" class="form-label">Your Name</label>
      <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your name">
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Feedback</label>
      <textarea id="message" name="message" class="form-control" required placeholder="Write your feedback here" rows="4"></textarea>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-danger" title="Submit Feedback">Submit</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init();</script>
</body>
</html>
