<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
</head>
<body id="cntbdy">

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand" href="/">BloodPortal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
        <li class="nav-item"><a class="nav-link active" href="/contact">Contact Us</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="cnt mt-5">
  <h2 class="text-center mb-4">Contact Us</h2>
  <form method="POST" action="">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      <label for="name" class="form-label">Your Name</label>
      <input type="text" id="name" name="name" class="form-control" required placeholder="Enter your name">
    </div>
    <div class="mb-3">
      <label for="contact" class="form-label">Mobile Number</label>
      <input type="tel" id="contact" name="contact" class="form-control" required placeholder="Enter contact number"
        pattern="[0-9]{10}" maxlength="10" minlength="10" title="Enter a 10-digit contact number">
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Your Message</label>
      <textarea id="message" name="message" class="form-control" required placeholder="Enter your message"
        aria-label="Your message"></textarea>
    </div>
    <button type="submit" class="btn btn-success" title="Send Message">Send</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
