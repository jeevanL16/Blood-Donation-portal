<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/forms.css">

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg">
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container">
    <a class="navbar-brand" href="/">BloodPortal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
  </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/donor">Become Donor</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="rform mt-5" data-aos="fade-up">
  <h2 class="mb-4 text-center text-danger">Request Blood</h2>
  <form method="POST">
    {{ form.hidden_tag() }}
    <div class="mb-3">
      <label for="name" class="form-label">Patient Name</label>
      <input type="text" class="form-control" id="name" name="name" required placeholder="Enter patient name">
    </div>
    <div class="mb-3">
      <label for="age" class="form-label">Age</label>
      <input type="number" id="age" name="age" class="form-control" required placeholder="Enter your age">
    </div>
    <div class="mb-3">
      <label for="gender" class="form-label">Gender</label>
      <select id="gender" name="gender" class="form-select" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="bloodgroup" class="form-label">Required Blood Group</label>
      <select class="form-select" id="bloodgroup" name="bloodgroup" required>
        <option value="">Select</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="location" class="form-label">Location</label>
      <input type="text" id="location" name="location" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="contact" class="form-label">Contact Number</label>
<input type="tel" id="contact" name="contact" class="form-control" required placeholder="Enter contact number" pattern="[0-9]{10}" maxlength="10" minlength="10" title="Enter a 10-digit contact number">
    </div>
    <div class="mb-3">
      <label for="reason" class="form-label">Reason</label>
      <input type="text" id="reason" name="reason" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="hospital" class="form-label">Hospital Name</label>
      <input type="text" id="hospital" name="hospital" class="form-control" required>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-danger">Submit</button>
    </div>
  </form>
  
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init();</script>
</body>
</html>
